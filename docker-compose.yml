services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tickets
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["node", "dist/db/runMigrations.js"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/tickets
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@db:5432/tickets
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db-data:
